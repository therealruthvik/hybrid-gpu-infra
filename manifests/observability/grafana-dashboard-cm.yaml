apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-inference-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  gpu-inference.json: |
    {
      "title": "GPU Inference — Hybrid Cluster",
      "uid": "gpu-inference-v1",
      "timezone": "browser",
      "schemaVersion": 38,
      "refresh": "15s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "GPU Utilization (%)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "DCGM_FI_DEV_GPU_UTIL{namespace='observability'}",
              "legendFormat": "GPU {{gpu}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "steps": [
                  {"color": "red", "value": 0},
                  {"color": "yellow", "value": 40},
                  {"color": "green", "value": 60}
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "GPU Memory Used (MiB)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "DCGM_FI_DEV_FB_USED{namespace='observability'}",
              "legendFormat": "Used GPU {{gpu}}",
              "refId": "A"
            },
            {
              "expr": "DCGM_FI_DEV_FB_FREE{namespace='observability'}",
              "legendFormat": "Free GPU {{gpu}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "decmbytes"}
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Inference Latency — p50 / p95 (s)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(vllm:e2e_request_latency_seconds_bucket[2m])) by (le))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(vllm:e2e_request_latency_seconds_bucket[2m])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "s"}
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Active Requests",
          "gridPos": {"h": 8, "w": 6, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "vllm:num_requests_running",
              "legendFormat": "Running",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "gauge",
          "title": "KV Cache Usage (%)",
          "gridPos": {"h": 8, "w": 6, "x": 18, "y": 8},
          "targets": [
            {
              "expr": "vllm:gpu_cache_usage_perc * 100",
              "legendFormat": "Cache %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        }
      ]
    }
