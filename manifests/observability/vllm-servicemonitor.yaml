apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-mistral
  namespace: observability
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
    - gpu-workloads
  selector:
    matchLabels:
      app: vllm-mistral
  endpoints:
  - port: http
    interval: 15s
    path: /metrics
