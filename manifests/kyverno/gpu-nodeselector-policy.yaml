apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-gpu-nodeselector
  annotations:
    policies.kyverno.io/title: Require GPU nodeSelector
    policies.kyverno.io/description: >
      Any pod requesting nvidia.com/gpu must have nodeSelector
      node-role=gpu-worker. Prevents GPU pods from targeting
      the control plane or non-GPU nodes.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: check-gpu-nodeselector
    match:
      any:
      - resources:
          kinds:
          - Pod
    preconditions:
      any:
      - key: "{{ request.object.spec.containers[].resources.limits.\"nvidia.com/gpu\" | to_array(@) | length(@) }}"
        operator: GreaterThanOrEquals
        value: "1"
    validate:
      message: >
        Pod requests nvidia.com/gpu but is missing
        nodeSelector 'node-role: gpu-worker'.
        Add spec.nodeSelector.node-role=gpu-worker.
      pattern:
        spec:
          nodeSelector:
            node-role: gpu-worker
