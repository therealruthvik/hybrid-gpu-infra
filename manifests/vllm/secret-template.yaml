# DO NOT commit real tokens. Create this secret manually:
#   kubectl create secret generic hf-token -n gpu-workloads \
#     --from-literal=token=<YOUR_HUGGINGFACE_TOKEN>
#
# Or apply this template after substituting the token:
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: gpu-workloads
type: Opaque
stringData:
  token: "REPLACE_WITH_HF_TOKEN"
